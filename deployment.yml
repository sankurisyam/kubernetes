apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyapp
  labels:
    app: pyapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pyapp
  template:
    metadata:
      labels:
        app: pyapp
    spec:
      containers:
      - name: pyapp
        image: syam32/pyweb:v2
        volumeMounts:
         - name: dbconnection
           mountPath: /opt
        ports:
        - containerPort: 8000
      volumes: 
        - name: dbconnection
          configMap: 
            name: test-cm
